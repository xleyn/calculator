<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator App</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="../js/calculator/calculator.js" defer></script>
  </head>

  <body>
    <header>
      <nav id="navbar-main">
        <a id="brand-logo" href="../index.html">Logo</a>
        <ul id="navbar-right">
          <li><a href="../index.html">Home</a></li>
          <li><a href="calculator.html">Calculator</a></li>
          <li><a href="#">About</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div id="calculator-panels">
        <section id="panel-calculator">
          <h2>Calculator</h2>
          <div id="calculator" class="container">
            <div id="calculator-display"></div>
            <div id="calculator-buttons">
              <button class="btn" data-code="clear">AC</button>
              <button class="btn" data-code="backspace">
                <i
                  class="fa-solid fa-delete-left"
                  style="color: rgba(0, 0, 0, 0.7)"
                ></i>
              </button>
              <button class="btn" data-code=""></button>
              <button class="btn" data-code=""></button>
              <button class="btn" data-code="(">(</button>
              <button class="btn" data-code=")">)</button>
              <button class="btn" data-code="!">x!</button>
              <button class="btn" data-code="^">^</button>
              <button class="btn" data-code="7">7</button>
              <button class="btn" data-code="8">8</button>
              <button class="btn" data-code="9">9</button>
              <button class="btn" data-code="/">÷</button>
              <button class="btn" data-code="4">4</button>
              <button class="btn" data-code="5">5</button>
              <button class="btn" data-code="6">6</button>
              <button class="btn" data-code="*">x</button>
              <button class="btn" data-code="1">1</button>
              <button class="btn" data-code="2">2</button>
              <button class="btn" data-code="3">3</button>
              <button class="btn" data-code="-">-</button>
              <button class="btn" data-code="0">0</button>
              <button class="btn" data-code=".">.</button>
              <button class="btn" data-code="calculate">=</button>
              <button class="btn" data-code="+">+</button>
            </div>
          </div>
        </section>
        <section id="panel-ast">
          <h2>Parser Abstract Structure Tree</h2>
          <div id="ast-container" class="container"></div>
        </section>
      </div>
    </main>
    <footer>
      Developed by @xleyn.
      <div>
        Check out my other work at
        <a href="https://github.com/xleyn">https://github.com/xleyn</a>
      </div>
    </footer>
  </body>
</html>
