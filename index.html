<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="calculator">
        <div id="panel-display"></div>
        <div id="panel-buttons">
            <div id="panel-top">
                <button class="btn" data-repr="clear">AC</button>
                <button class="btn" data-repr="#"></button>
                <button class="btn" data-repr="#"></button>
                <button class="btn" data-repr="#"></button>
            </div>
            <div id="panel-middle">
                <div id="panel-middle-left">
                    <button class="btn" data-repr="0">0</button>
                    <button class="btn" data-repr="dec">.</button>
                    <button class="btn" data-repr="calc">=</button>
                    <button class="btn" data-repr="1">1</button>
                    <button class="btn" data-repr="2">2</button>
                    <button class="btn" data-repr="3">3</button>
                    <button class="btn" data-repr="4">4</button>
                    <button class="btn" data-repr="5">5</button>
                    <button class="btn" data-repr="6">6</button>
                    <button class="btn" data-repr="7">7</button>
                    <button class="btn" data-repr="8">8</button>
                    <button class="btn" data-repr="9">9</button>
                </div>
                <div id="panel-middle-right">
                    <button class="btn" data-repr="+">+</button>
                    <button class="btn" data-repr="-">-</button>
                    <button class="btn" data-repr="*">x</button>
                    <button class="btn" data-repr="/">÷</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
