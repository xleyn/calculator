<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/script_parser.js" defer></script>
</head>

<body>
    <h1>Frontend Calculator Prototype</h1>
    <div id="panel-calculator">
        <div id="calculator">
            <div id="panel-display"></div>
            <div id="panel-buttons">
                <button class="btn" data-code="clear">AC</button>
                <button class="btn" data-code="backspace"><i class="fa-solid fa-delete-left"
                        style="color: rgba(0, 0, 0, 0.7);"></i></button>
                <button class="btn" data-code=""></button>
                <button class="btn" data-code="^">^</button>
                <button class="btn" data-code="7">7</button>
                <button class="btn" data-code="8">8</button>
                <button class="btn" data-code="9">9</button>
                <button class="btn" data-code="/">÷</button>
                <button class="btn" data-code="4">4</button>
                <button class="btn" data-code="5">5</button>
                <button class="btn" data-code="6">6</button>
                <button class="btn" data-code="*">x</button>
                <button class="btn" data-code="1">1</button>
                <button class="btn" data-code="2">2</button>
                <button class="btn" data-code="3">3</button>
                <button class="btn" data-code="-">-</button>
                <button class="btn" data-code="0">0</button>
                <button class="btn" data-code=".">.</button>
                <button class="btn" data-code="calculate">=</button>
                <button class="btn" data-code="+">+</button>
                <button class="btn" data-code="(">(</button>
                <button class="btn" data-code=")">)</button>
            </div>
        </div>
    </div>

</body>

</html>
